name: Update classes

on:
  schedule:
    - cron: '0 13 * * *' # 6 AM Pacific (UTC-7)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run update-classes

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/classes.json
          git diff --cached --quiet || git commit -m "update upcoming classes"
          git push
